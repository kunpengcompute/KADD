name: PR-Pipeline_KADD #流水线的名称

on: # 自动触发工作流运行的触发条件
  workflow_dispatch: # 如果需要界面上手动运行工作流，必须将工作流配置为在 workflow_dispatch 事件上运行。支持在脚本里或者页面上指定输入参数。
  #pull_request: #MR的合并、打开和重开、更新事件都会触发
  #  types: ["merge", "open", "reopen", "update"]
  #  branches: [ "master" ] #作用于分支上
  pull_request_target: #MR的合并、打开和重开、更新事件都会触发默认分支的配置文件
  # pull_request: #MR的合并、打开和重开、更新事件都会触发
    types: ["merge", "open", "reopen", "update"]
    branches: [ "*" ] #作用于分支上
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' , 'sca-pr-scan']

permissions:
  repository: read
  id-token: write

inputs:
  pr_id:
    type: string
    description: ""
    default: "${{ atomgit.event.pull_request.number }}"
    manual_override: true
  branch:
    type: string
    description: ""
    default: "${{ atomgit.event.pull_request.base.ref }}"
    manual_override: true

stages:  #阶段，不超过16个阶段，不超过256个job
  stage0:  #stage identifier 仅支持大小写英文字母、数字、"-"或"_"，长度介于1~128之间
    name: 校验阶段 # 阶段名称
    select: selected_by_default  # always, selected_by_default，不配置的话默认为selected_by_default(任务根据其所属阶段的 select 属性或全局配置决定是否默认选中)

    jobs:  #任务，单stage下最多100个
      sca-pr:
        runs-on: ["ubuntu-latest", "x64", "slim"]
        steps:
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: "boostkit"
      malicious-scan:
        runs-on: ["ubuntu-latest", "x64", "slim"]
        steps:
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: "boostkit"
      build:
        name: build
        if: ${{ default() }}
        runs-on: [ self-hosted, os=euler] # X86、X64、ARM或ARM64
        container:
          image: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler-24.03-lts-sp2:arm_26630_01
        select: selected_by_default
        needs: [ sca-pr, malicious-scan]
        steps:
          - name: fast_checkout
            identifier: fast_checkout
            uses: checkout
            with: # 啥都不用写, 默认下载当前流水线触发仓
            # repository: 'https://test.gitcode.net/test_enterprise/label_test.git'
            # pull_request_target 工作流检出 fork PR 预合并引用会被安全拦截（pwn request 防护），需显式放行
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
            # path: repo
            # token: 代码仓token
            # ssh-key: ""
            # endpoint_id: ""
            # fetch-depth: 1
            # submodules: "false"
            # lfs: "false"
            # clean: "true"
          - name: build
            run: |-
                echo 'hello'
                ls -lart

                yum install cmake gcc gcc-c++ make wget unzip tar -y

                lscpu

                chmod +x build.sh
                sh build.sh
