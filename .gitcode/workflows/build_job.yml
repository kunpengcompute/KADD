name: Build Job

on:
  workflow_call:
    inputs:
      runs_on_flavor:
        required: true
        type: string
      docker_img:
        required: true
        type: string
      pr_id:
        required: true
        type: string

jobs:
  JOB_Compile:
    name: Compile
    select: selected_by_default
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, "${{ inputs.runs_on_flavor }}" ]
    container:
      image: ${{ inputs.docker_img }}
    steps:
      - name: fast_checkout
        identifier: fast_checkout
        uses: checkout
        with:
          # pull_request_target 工作流检出 fork PR 预合并引用会被安全拦截，需显式放行
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
      - name: prepare-deps
        run: |-
          # 第三方依赖（ONNX Runtime 1.28.0 / cJSON / gtest）已固化在镜像 /opt/kadd-deps，
          # 同步到 SQLi/util 后 build.sh 会跳过外网下载；镜像未内置时由 build.sh 自行下载
          if command -v kadd-deps-sync >/dev/null 2>&1; then
            kadd-deps-sync
          else
            echo "[WARN] 镜像未内置 kadd-deps-sync，将由 build.sh 自行下载依赖"
          fi
      - name: build
        run: |-
          chmod +x build.sh
          sh build.sh
          # 产物校验：根 build.sh 不会因 SQLi 构建失败而中断，用产物存在性兜底，避免假成功
          test -f SQLi/build/kadd_env.sh || { echo "[ERROR] 未生成 SQLi/build/kadd_env.sh，SQLi 构建失败"; exit 1; }
          ls -l SQLi/build/src/*.so
